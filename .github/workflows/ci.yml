name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: forwarder/package-lock.json

      - name: Install dependencies
        working-directory: forwarder
        run: npm ci

      - name: Check email parsing logic
        run: node scripts/check-email-parse.js

      - name: Check Svix signature verification
        run: node scripts/check-svix-verify.js
      
      - name: Check handler security validations
        run: node scripts/check-handler-validations.js

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: forwarder/package-lock.json

      - name: Install dependencies
        working-directory: forwarder
        run: npm ci

      - name: Run npm audit
        working-directory: forwarder
        run: npm audit --production
        continue-on-error: true

      - name: Check for secrets in git
        run: |
          echo "Checking for accidentally committed secrets..."
          
          # NOTE: git grep only scans the current checkout (tip), not full git history
          # Fail if any real-looking secrets are found
          if git grep -E "whsec_[A-Za-z0-9+/=]{32,}" -- ':(exclude).github/workflows/*.yml'; then
            echo "ERROR: Found real-looking whsec_ secrets in current checkout"
            exit 1
          fi
          
          if git grep -E "Bearer [A-Za-z0-9_-]{20,}" -- ':(exclude).github/workflows/*.yml'; then
            echo "ERROR: Found real-looking Bearer tokens in current checkout"
            exit 1
          fi
          
          if git grep -E "https://[a-z0-9-]+\.vercel\.app/api/webhook" -- ':(exclude).github/workflows/*.yml'; then
            echo "ERROR: Found real Vercel webhook URLs in current checkout"
            exit 1
          fi
          
          echo "No secrets found in current checkout."

      - name: Verify fail-closed signature enforcement
        run: |
          echo "Verifying fail-closed security in forwarder code..."
          
          # Ensure empty allowlist = deny-all
          if ! grep -q "if (!allowlist.length) return false" forwarder/api/index.js; then
            echo "ERROR: Empty allowlist must return false (deny-all)"
            exit 1
          fi
          
          # Ensure signature verification is fail-closed
          if ! grep -q 'if (!id || !timestamp || !signatureHeader)' forwarder/api/index.js; then
            echo "ERROR: Missing signature headers check"
            exit 1
          fi
          
          # Ensure ALLOW_UNSIGNED_WEBHOOKS is ignored when webhookSecret is set
          # Verify the code path: if (webhookSecret) { verify(); ... } else { check allowUnsigned }
          if ! grep -q 'if (webhookSecret)' forwarder/api/index.js; then
            echo "ERROR: Missing webhookSecret conditional check"
            exit 1
          fi
          
          echo "Fail-closed checks passed."

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: '18'

      - name: Check for real email addresses (PII)
        run: |
          echo "Checking for non-example.com email addresses..."
          node scripts/check-no-real-emails.js
          
          # Check that .env files are gitignored
          if ! grep -q "^\.env$" .gitignore; then
            echo "ERROR: .env must be in .gitignore"
            exit 1
          fi
          
          if ! grep -q "^\.secrets/$" .gitignore; then
            echo "ERROR: .secrets/ must be in .gitignore"
            exit 1
          fi
          
          echo "Lint checks passed."
